<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/fonts/inter.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/tokens/colors.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/tokens/typography.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/tokens/spacing.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/tokens/effects.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/styles.css">
<script src="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/_ds_bundle.js"></script>
<script src="./image-slot.js"></script>
<style>body{margin:0}a{color:inherit;text-decoration:none}
@media (max-width:700px){.ft-top{grid-template-columns:1fr!important}}
</style>
</helmet>
<footer style="background:var(--slate-900);font-family:var(--font-sans);padding:48px 32px 24px">
  <div style="max-width:1200px;margin:0 auto">
    <div class="ft-top" style="display:grid;grid-template-columns:1fr 320px;gap:48px;align-items:center;padding-bottom:32px">
      <div>
        <img src="assets/logo.svg" alt="Unilife" style="height:30px;filter:brightness(0) invert(1);margin-bottom:14px"/>
        <div style="font-size:14px;line-height:20px;color:rgba(255,255,255,0.6);max-width:340px;margin-bottom:20px">{{ f.blurb }}</div>
        <div style="display:flex;gap:28px;font-size:14px;font-weight:500;color:rgba(255,255,255,0.85);flex-wrap:wrap">
          <a href="About.dc.html" style="color:rgba(255,255,255,0.85)">{{ f.about }}</a>
          <a href="Career.dc.html" style="color:rgba(255,255,255,0.85)">{{ f.career }}</a>
          <a href="Contact.dc.html" style="color:rgba(255,255,255,0.85)">{{ f.contact }}</a>
        </div>
      </div>
      <image-slot id="footer-map" style="width:100%;height:150px" shape="rounded" radius="8" placeholder="Карта — офіс / виробництво"></image-slot>
    </div>
    <x-import component-from-global-scope="UnilifeDesignSystem_329c9a.Separator" hint-size="100%,1px"></x-import>
    <div style="border-top:1px solid rgba(255,255,255,0.1);padding-top:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
      <div style="font-size:13px;color:rgba(255,255,255,0.5)">{{ f.rights }}</div>
      <div style="display:flex;gap:16px;color:rgba(255,255,255,0.6)">
        <a href="#" aria-label="Facebook" style="display:flex;color:inherit"><x-import component-from-global-scope="UnilifeDesignSystem_329c9a.Icon" name="IconFacebook" size="16" hint-size="16px,16px"></x-import></a>
        <a href="#" aria-label="Instagram" style="display:flex;color:inherit"><x-import component-from-global-scope="UnilifeDesignSystem_329c9a.Icon" name="IconInstagram" size="16" hint-size="16px,16px"></x-import></a>
        <a href="#" aria-label="LinkedIn" style="display:flex;color:inherit"><x-import component-from-global-scope="UnilifeDesignSystem_329c9a.Icon" name="IconLinkedin" size="16" hint-size="16px,16px"></x-import></a>
      </div>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:320}}">
class Component extends DCLogic {
  state = { i18n: null };
  async componentDidMount() {
    const mod = await import("./i18n.js");
    this.setState({ i18n: mod });
  }
  renderVals() {
    const mod = this.state.i18n;
    if (!mod) return {};
    return { f: mod.t[mod.getLang()].footer };
  }
}
</script>
</body>
</html>
