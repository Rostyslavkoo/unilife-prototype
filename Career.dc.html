<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/fonts/inter.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/tokens/colors.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/tokens/typography.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/tokens/spacing.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/tokens/effects.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/styles.css">
<script src="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/_ds_bundle.js"></script>
<style>body{margin:0}a{color:var(--primary)}a:hover{color:var(--primary-hover)}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-root{animation:pageIn .32s ease-out}
@media (max-width:700px){
  .cr-row{grid-template-columns:1fr!important;gap:8px!important;text-align:left}
}
</style>
</helmet>
<div class="page-root" style="font-family:var(--font-sans);color:var(--fg-default);background:var(--bg-page);min-height:100vh">
<dc-import name="Header" active-page="career" hint-size="100%,72px"></dc-import>

<div style="max-width:1200px;margin:0 auto;padding:40px 32px 96px">
  <div style="font-size:30px;line-height:36px;font-weight:600;letter-spacing:-0.007em;margin-bottom:8px">{{ ct.title }}</div>
  <div style="font-size:16px;line-height:28px;color:var(--fg-muted);margin-bottom:48px;max-width:640px">{{ ct.desc }}</div>

  <div style="display:flex;flex-direction:column;gap:1px;background:var(--border-default)">
    <sc-for list="{{ jobs }}" as="j" hint-placeholder-count="5">
      <div class="cr-row" style="background:var(--bg-page);padding:28px 0;display:grid;grid-template-columns:1fr auto auto auto;gap:24px;align-items:center">
        <div>
          <div style="font-size:17px;font-weight:600;color:var(--fg-default);margin-bottom:4px">{{ j.title }}</div>
          <div style="font-size:14px;color:var(--fg-muted)">{{ j.dept }}</div>
        </div>
        <div style="font-size:14px;color:var(--fg-muted);white-space:nowrap">{{ j.location }}</div>
        <div style="font-size:14px;color:var(--fg-muted);white-space:nowrap">{{ j.type }}</div>
        <x-import component-from-global-scope="UnilifeDesignSystem_329c9a.Button" variant="outline" size="sm" hint-size="auto,36px">{{ ct.apply }}</x-import>
      </div>
    </sc-for>
  </div>

</div>

<dc-import name="Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { i18n: null };
  async componentDidMount() {
    const mod = await import("./i18n.js");
    const tr = await import("./transitions.js");
    tr.bindPageTransitions();
    this.setState({ i18n: mod });
  }
  renderVals() {
    const mod = this.state.i18n;
    if (!mod) return {};
    return {
      ct: mod.t[mod.getLang()].career,
      jobs: [
        { title: "Оператор виробничої лінії", dept: "Виробництво", location: "Київ", type: "Повний день" },
        { title: "Технолог з рецептур побутової хімії", dept: "R&D", location: "Київ", type: "Повний день" },
        { title: "Менеджер із закупівель сировини", dept: "Закупівлі", location: "Київ", type: "Повний день" },
        { title: "Спеціаліст з контролю якості", dept: "Якість", location: "Київ", type: "Повний день" },
        { title: "Менеджер з розвитку роздрібних мереж", dept: "Продажі", location: "Київ / віддалено", type: "Повний день" },
      ],
    };
  }
}
</script>
</body>
</html>
