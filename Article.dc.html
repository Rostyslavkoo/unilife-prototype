<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/fonts/inter.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/tokens/colors.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/tokens/typography.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/tokens/spacing.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/tokens/effects.css">
<link rel="stylesheet" href="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/styles.css">
<script src="_ds/unilife-design-system-329c9ab8-f5c3-4dd6-bd94-d5d868cf8aec/_ds_bundle.js"></script>
<script src="./image-slot.js"></script>
<style>body{margin:0}a{color:var(--primary)}a:hover{color:var(--primary-hover)}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-root{animation:pageIn .32s ease-out}
</style>
</helmet>
<div class="page-root" style="font-family:var(--font-sans);color:var(--fg-default);background:var(--bg-page);min-height:100vh">
<dc-import name="Header" active-page="article" hint-size="100%,72px"></dc-import>

<sc-if value="{{ loaded }}" hint-placeholder-val="{{ false }}">
<div style="max-width:720px;margin:0 auto;padding:40px 32px 96px">
  <a href="News.dc.html" style="font-size:13px;color:var(--fg-muted)">{{ at.back }}</a>
  <div style="font-size:13px;color:var(--fg-subtle);margin:20px 0 12px">{{ n.dateLabel }}</div>
  <div style="font-size:30px;line-height:36px;font-weight:600;letter-spacing:-0.007em;margin-bottom:24px">{{ n.titleOut }}</div>
  <image-slot id="{{ n.imgId }}" style="width:100%;height:320px;margin-bottom:32px" shape="rounded" radius="12" placeholder="Фото новини"></image-slot>
  <sc-for list="{{ n.paragraphs }}" as="para" hint-placeholder-count="3">
    <div style="font-size:16px;line-height:28px;color:var(--fg-default);margin-bottom:20px">{{ para }}</div>
  </sc-for>
</div>
</sc-if>
<sc-if value="{{ notFound }}" hint-placeholder-val="{{ false }}">
  <div style="padding:96px 32px;text-align:center;color:var(--fg-muted)">{{ at.notFound }} <a href="News.dc.html">{{ at.back }}</a></div>
</sc-if>

<dc-import name="Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { data: null, i18n: null };
  async componentDidMount() {
    const [data, i18n, tr] = await Promise.all([import("./data.js"), import("./i18n.js"), import("./transitions.js")]);
    tr.bindPageTransitions();
    this.setState({ data, i18n });
  }
  renderVals() {
    const d = this.state.data, mod = this.state.i18n;
    if (!d || !mod) return { loaded: false, notFound: false };
    const lang = mod.getLang();
    const en = lang === "en";
    const at = mod.t[lang].article;
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const item = d.news.find(x => x.id === id) || d.news[0];
    if (!item) return { loaded: false, notFound: true, at };
    const months = en ? ["January","February","March","April","May","June","July","August","September","October","November","December"]
      : ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
    const dt = new Date(item.date);
    const dateLabel = en ? `${months[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}` : `${dt.getDate()} ${months[dt.getMonth()]} ${dt.getFullYear()}`;
    return {
      loaded: true,
      notFound: false,
      at,
      n: { ...item, dateLabel, titleOut: en ? item.titleEn : item.title, imgId: `article-${item.id}`, paragraphs: (en ? item.bodyEn : item.body).split("\n\n") },
    };
  }
}
</script>
</body>
</html>
